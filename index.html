<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La Cave</title>
  <meta name="description" content="Visualisez et gérez les bouteilles de la cave à vin.">
  <meta name="theme-color" content="#f3ede3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="La Cave">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body data-mode="loading">
  <canvas id="scene" aria-label="Cave à vin en 3D"></canvas>

  <!-- Vue d'ensemble -->
  <header class="ov ov-head">
    <span class="kicker">La cave de</span>
    <h1>Camille</h1>
  </header>
  <aside class="ov ov-stats" id="stats"></aside>
  <div class="ov cab-labels" id="cab-labels"></div>
  <button class="ov ov-cta" id="btn-enter">
    <span>Entrer dans la cave</span>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>

  <!-- Vue cave -->
  <div class="cab cab-bar">
    <button class="round" id="btn-back" aria-label="Retour">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div class="chips" id="filters">
      <button data-filter="all" class="on">Tout</button>
      <button data-filter="B">Blancs</button>
      <button data-filter="R">Rouges</button>
      <button data-filter="drink">À boire</button>
    </div>
    <button class="round" id="btn-sort" aria-label="Ranger la cave">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>
    </button>
  </div>
  <div class="sort-pop" id="sort-pop" role="menu">
    <span class="kicker">Ranger la cave par</span>
    <button data-sort="domaine" class="on">Domaine</button>
    <button data-sort="millesime">Millésime</button>
    <button data-sort="region">Région</button>
    <button data-sort="obtention">Date d'obtention</button>
    <button data-sort="couleur">Couleur</button>
    <button data-sort="garde">Urgence</button>
  </div>
  <div class="cab cab-hint" id="cab-hint">Glissez pour parcourir · touchez une bouteille</div>
  <nav class="cab cab-nav" id="cab-nav" aria-label="Caves"></nav>

  <!-- Cave des souvenirs -->
  <div class="mem mem-bar">
    <button class="round" id="btn-mem-back" aria-label="Retour">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div class="mem-title"><span class="kicker">La cave des</span><b>Souvenirs</b><small id="mem-count"></small></div>
  </div>
  <div class="mem mem-years chips" id="mem-years"></div>
  <div class="mem mem-empty" id="mem-empty">
    <b>Le mur est encore vide</b>
    <span>Débouchez une bouteille : elle viendra se poser ici, avec la date, les personnes et le moment partagé.</span>
  </div>

  <!-- Barre d'actions -->
  <nav class="dock">
    <button id="tab-cave" class="tab" aria-label="Cave">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5h4M10.5 2.5v4.2c0 1.1-.4 1.9-1.3 2.7-.9.9-1.7 2-1.7 3.6v8.5h9v-8.5c0-1.6-.8-2.7-1.7-3.6-.9-.8-1.3-1.6-1.3-2.7V2.5"/><path d="M7.5 14h9"/></svg>
      <span>Cave</span>
    </button>
    <button id="tab-mem" class="tab" aria-label="Souvenirs">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10l-.5 5.5a4.5 4.5 0 0 1-9 0zM12 13v8M8.5 21h7"/><path d="M7.3 6h9.4"/></svg>
      <span>Souvenirs</span>
    </button>
    <button id="btn-add" class="primary" aria-label="Ajouter une bouteille">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="btn-list" aria-label="Inventaire">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".8" fill="currentColor"/><circle cx="4" cy="12" r=".8" fill="currentColor"/><circle cx="4" cy="18" r=".8" fill="currentColor"/></svg>
      <span>Liste</span>
    </button>
    <button id="btn-settings" aria-label="Réglages">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span>Réglages</span>
    </button>
  </nav>

  <!-- Fiche bouteille -->
  <section class="detail" id="detail" aria-live="polite"></section>

  <!-- Inventaire -->
  <section class="panel" id="list-panel" aria-label="Inventaire">
    <div class="panel-head">
      <h2 id="list-title">Inventaire</h2>
      <button class="round" id="btn-list-close" aria-label="Fermer">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="panel-tools">
      <div class="search">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Domaine, appellation, millésime…" autocomplete="off">
      </div>
      <label class="sort">Ranger par
        <select id="sort">
          <option value="domaine">domaine</option>
          <option value="couleur">couleur</option>
          <option value="millesime">millésime</option>
          <option value="region">région</option>
          <option value="obtention">date d'obtention</option>
          <option value="garde">urgence</option>
        </select>
      </label>
    </div>
    <div class="panel-body" id="list"></div>
  </section>

  <!-- Feuille (formulaire, réglages) -->
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="grab"><span></span></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="ask" id="ask"></div>

  <div class="veil" id="veil">
    <div class="veil-in">
      <span class="kicker">La cave de</span>
      <div class="veil-title">Camille</div>
      <div class="veil-bar"><i></i></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
